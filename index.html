<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한일 달력</title>
<meta name="theme-color" content="#eef0f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한일 달력">
<style>
  :root{
    --bg:#eef0f4;--surface:#ffffff;--ink:#20242e;--muted:#868d9c;--line:#e4e7ee;
    --jp:#dd3d3d;--jp-soft:#fceaea;--jp-edge:#f3c4c4;
    --vac:#c62f2f;--vac-soft:#f7cccc;--vac-edge:#eba3a3;
    --kr:#bf7900;--kr-soft:#f6dfb0;--kr-edge:#e6c47f;--kr-ink:#8f5b00;
    --sun:#df6a6a;--sat:#6b8fd6;--today:#20242e;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Noto Sans KR','Noto Sans JP','Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:max(20px,env(safe-area-inset-top)) 14px max(48px,env(safe-area-inset-bottom))}
  .wrap{max-width:760px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap}
  .title{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
  .title small{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0}
  .topright{display:flex;align-items:center;gap:10px;flex:none}
  .clock{font-weight:800;font-size:1.6rem;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .clock .cd{color:var(--muted);font-weight:700;font-size:1rem;margin-right:8px}
  .modebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;
    cursor:pointer;font-size:1.05rem;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
  .modebtn:hover{background:var(--bg)}
  .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
  /* 날씨: 서울 신정동 · 도쿄 */
  .weather{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:32px}
  .weather .wx{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px 4px 10px;font-size:.84rem;font-weight:700;color:var(--ink);white-space:nowrap}
  .weather .wx .ic,.weather .wx .aq .e{display:inline-flex;align-items:center;justify-content:center;line-height:1;transform:translateY(-.1em)}
  .weather .wx .ic{font-size:1.1rem;height:1.1rem}
  .weather .wx .pl{color:var(--muted);font-weight:600}
  .weather .wx .tp{font-variant-numeric:tabular-nums}
  /* PC: 달력 양옆의 큰 이전/다음 버튼 */
  .calwrap{position:relative}
  .side{display:none;position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer;
    align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:background .15s,transform .15s}
  .side:hover{background:var(--ink);color:var(--surface)}
  .side:disabled{opacity:.25;cursor:default;background:var(--surface);color:var(--ink)}
  .side.prev{left:-76px}.side.next{right:-76px}
  @media(min-width:940px) and (hover:hover){.side{display:flex}}
  /* 넘길 때 살짝 미끄러지는 효과 */
  .grid.slide-next{animation:slideNext .22s ease-out}
  .grid.slide-prev{animation:slidePrev .22s ease-out}
  @keyframes slideNext{from{opacity:.3;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes slidePrev{from{opacity:.3;transform:translateX(-24px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.grid.slide-next,.grid.slide-prev{animation:none}}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
  .yearseg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .yearseg button{border:none;background:transparent;font:inherit;font-weight:700;color:var(--muted);
    padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
  .yearseg button.on{background:var(--ink);color:#fff}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:3px;position:relative}
  .nav button{width:34px;height:34px;border:none;background:transparent;border-radius:50%;font-size:1.1rem;
    color:var(--ink);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .nav button:hover{background:var(--bg)}
  /* 작은 ‹ › 는 숨김 (PC는 양옆 큰 버튼, 모바일은 밀어서 넘기기).
     양옆 버튼이 안 들어가는 좁은 PC 창에서만 보이게 */
  #prev,#next{display:none}
  @media(max-width:939px) and (hover:hover){#prev,#next{display:flex}}
  .nav .mlabel{min-width:112px;text-align:center;font-weight:800;font-size:.98rem;cursor:pointer;
    user-select:none;border-radius:999px;padding:5px 14px;transition:background .15s}
  .nav .mlabel:hover{background:var(--bg)}
  .mpicker{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:30;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);
    gap:6px;box-shadow:0 10px 28px rgba(0,0,0,.14);width:210px}
  .mpicker[hidden]{display:none}
  .mpicker button{width:auto;height:auto;border:1px solid var(--line);background:var(--surface);font:inherit;
    font-weight:700;font-size:.85rem;padding:9px 0;border-radius:8px;cursor:pointer;color:var(--ink)}
  .mpicker button:hover{background:var(--bg)}
  .mpicker button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .todaybtn{border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:700;color:var(--ink);
    padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.85rem}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 2px 14px;font-size:.82rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .chip{width:14px;height:14px;border-radius:5px;display:inline-block;flex:none}
  .chip.jp{background:var(--jp)}.chip.kr{background:var(--kr)}.chip.vac{background:var(--vac)}
  .chip.both{background:linear-gradient(135deg,var(--jp) 50%,var(--kr) 50%)}
  .chip.td{background:#fff;border:2px solid var(--today)}
  .cal{touch-action:pan-y;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:2px}
  .dow div{text-align:center;font-size:.74rem;font-weight:700;color:var(--muted);padding:8px 0}
  .dow div:first-child{color:var(--sun)}.dow div:last-child{color:var(--sat)}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cell{min-height:74px;border-radius:10px;padding:7px 6px 5px;position:relative;display:flex;flex-direction:column;
    gap:3px;background:var(--bg);cursor:pointer;transition:box-shadow .12s}
  .cell:not(.blank):hover{box-shadow:inset 0 0 0 1px var(--muted)}
  .cell.blank{background:transparent;cursor:default}
  .cell.out{background:transparent;cursor:default}
  .cell.out .n{color:#c3c8d1;font-weight:600}
  .cell.out.sun .n{color:#ecc6c6}
  .cell.out.sat .n{color:#c6d3ec}
  .cell.out.o-jp{background:#fdf4f4;box-shadow:inset 0 0 0 1px #f7e0e0}.cell.out.o-jp .n{color:#eaa8a8}
  .cell.out.o-kr{background:#fbf4e2;box-shadow:inset 0 0 0 1px #efe1bb}.cell.out.o-kr .n{color:#d9b968}
  .cell.out.o-both{background:linear-gradient(135deg,#fdf4f4 55%,#fbf4e2 45%);box-shadow:inset 0 0 0 1px #f7e0e0}.cell.out.o-both .n{color:#ecab7c}
  .cell.out.o-vac{background:#fdefef;box-shadow:inset 0 0 0 1px #f3d4d4}.cell.out.o-vac .n{color:#e39c9c}
  .cell .n{font-size:.9rem;font-weight:700;line-height:1}
  .cell.sun .n{color:var(--sun)}.cell.sat .n{color:var(--sat)}
  .cell.jp{background:var(--jp-soft);box-shadow:inset 0 0 0 1px var(--jp-edge)}.cell.jp .n{color:#e06a6a}
  .cell.kr{background:var(--kr-soft);box-shadow:inset 0 0 0 1px var(--kr-edge)}.cell.kr .n{color:#cf9500}
  .cell.both{background:linear-gradient(135deg,var(--jp-soft) 55%,var(--kr-soft) 45%);box-shadow:inset 0 0 0 1px var(--jp-edge)}
  .cell.both .n{color:#e0670c}
  .cell.vac{background:var(--vac-soft);box-shadow:inset 0 0 0 1px var(--vac-edge)}.cell.vac .n{color:var(--vac)}
  .cell.today{box-shadow:inset 0 0 0 3px #0c8377}
  .todaydot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#0c8377}
  .cell .hname{font-size:.66rem;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cell .hname.jp{color:var(--jp)}.cell .hname.kr{color:var(--kr-ink)}.cell .hname.vac{color:var(--vac);font-weight:800}
  .cell .bday{font-size:.66rem;font-weight:800;color:#c85fb0;line-height:1.2}
  /* 생일: 칸은 은은하게 빛나고, 글자는 무지개빛이 흐르게 */
  .cell.bdaycell{background:linear-gradient(135deg,#ffe3f3,#f1e6ff 60%,#fff2dc);
    animation:bdayGlow 2.6s ease-in-out infinite}
  .cell.bdaycell .n{color:#c2409a}
  .cell .bday{white-space:nowrap}
  /* 글자는 진한 색으로 선명하게 두고, 그 위로 밝은 빛줄기만 지나가게 */
  .cell .bday .t{font-size:.72rem;font-weight:900;
    background:linear-gradient(100deg,#c2187a 0%,#c2187a 40%,#ff8ad0 50%,#c2187a 60%,#c2187a 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 2.4s linear infinite}
  @keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
  body.dark .cell .bday .t{background-image:linear-gradient(100deg,#ff7cc8 0%,#ff7cc8 40%,#fff 50%,#ff7cc8 60%,#ff7cc8 100%)}
  .cell .bday .e{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
  .list .tag.bday{background:linear-gradient(90deg,#ffd6ee,#eadcff,#ffe9c7,#ffd6ee);background-size:300% 100%;
    animation:shimmer 3.5s linear infinite}
  @keyframes shimmer{to{background-position:300% 0}}
  @keyframes bdayGlow{
    0%,100%{box-shadow:inset 0 0 0 1px #f3b6dc,0 0 0 rgba(255,79,168,0)}
    50%{box-shadow:inset 0 0 0 2px #ff7cc3,0 0 14px rgba(255,79,168,.55)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) rotate(-6deg)}}
  @media(prefers-reduced-motion:reduce){.cell.bdaycell,.cell .bday .t,.cell .bday .e,.list .tag.bday{animation:none}}
  .todaydot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--today)}
  .ytotal{margin:16px 2px 4px;font-size:.95rem;font-weight:800;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 15px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .ytotal .yr{color:var(--muted);font-weight:700;font-size:.85rem}
  .ytotal b.jp{color:var(--jp)}.ytotal b.vac{color:var(--vac)}
  .summary{margin:10px 2px 6px;font-size:.9rem;font-weight:700}
  .summary b.jp{color:var(--jp)}.summary b.vac{color:var(--vac)}
  .list{list-style:none;display:flex;flex-direction:column;gap:1px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .list li{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
  .list li:first-child{border-top:none}
  .list li.vacrow{background:#fdf3f3}
  .list .seq{width:22px;height:22px;border-radius:50%;background:var(--vac);color:#fff;font-size:.74rem;
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .list .seqgap{width:22px;flex:none}
  .list .date{font-weight:800;font-size:.9rem;width:52px;flex:none}
  .list .date .wd{font-weight:600;color:var(--muted);font-size:.78rem;margin-left:3px}
  .list .tag{font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;flex:none}
  .list .tag.jp{background:var(--jp-soft);color:var(--jp)}.list .tag.kr{background:var(--kr-soft);color:var(--kr-ink)}
  .list .tag.vac{background:var(--vac-soft);color:var(--vac)}.list .tag.bday{background:#fbe6f4;color:#c85fb0}
  .list .nm{font-size:.9rem}.list .empty{padding:20px 14px;color:var(--muted);font-size:.88rem;text-align:center}
  .divider{padding:7px 14px;font-size:.72rem;font-weight:700;color:var(--muted);background:#fafbfc;border-top:1px solid var(--line)}
  .hint{margin:12px 4px 0;font-size:.78rem;color:var(--muted);line-height:1.6}
  .note{margin:8px 4px 0;font-size:.76rem;color:#b97d0c;line-height:1.6}
  /* 칸 안의 날씨 예보 (오늘부터 7일) */
  .cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .cell .fc{position:absolute;top:5px;right:5px;display:flex;align-items:center;gap:2px;font-size:.8rem;line-height:1}
  .cell .fc b{font-size:.62rem;font-weight:700;color:var(--muted)}
  .cell .n .fe{font-style:normal;font-size:.8rem;margin-left:2px}
  /* 월급날 · 메모 */
  .cell .pay{font-size:.66rem;font-weight:800;color:#0f8a5f;white-space:nowrap}
  .cell .memo{display:block;max-width:100%;cursor:help;font-size:.64rem;font-weight:600;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;background:var(--surface);border-radius:5px;padding:1px 4px;opacity:.9}
  /* 메모에 마우스를 올리면 전체 내용을 말풍선으로 */
  .cell .memotip{display:none;position:absolute;left:4px;top:calc(100% - 4px);z-index:20;width:max-content;max-width:220px;
    background:#20242e;color:#fff;font-size:.74rem;font-weight:600;line-height:1.4;padding:6px 9px;border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:normal;word-break:break-all;pointer-events:none}
  .cell .memo:hover+.memotip{display:block}
  .list .tag.pay{background:#dff5ea;color:#0f8a5f}.list .tag.memo{background:var(--bg);color:var(--ink)}
  body.dark .cell .pay{color:#4cd49a}body.dark .list .tag.pay{background:#163b2b;color:#4cd49a}
  /* 날씨 줄: 미세먼지 · 환율 */
  .weather .wx .sep{width:1px;height:12px;background:var(--line)}
  .weather .wx .aq.good{color:#1a8fd6}.weather .wx .aq.ok{color:#0f8a5f}.weather .wx .aq.bad{color:#e07a0c}.weather .wx .aq.worse{color:#e03b3b}
  .weather .wx .up{color:#e03b3b;font-size:.72rem}.weather .wx .down{color:#1a6fd6;font-size:.72rem}
  /* 메모 입력 창 */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .mbox .mtitle{font-weight:800;margin-bottom:10px}
  .mbox input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);outline:none}
  .mbox input:focus{border-color:var(--ink)}
  .mbox .mbtns{display:flex;gap:8px;margin-top:12px}.mbox .mbtns span{flex:1}
  .mbox button{font:inherit;font-weight:700;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 16px;cursor:pointer}
  .mbox button.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .mbox button.del{color:#e03b3b}
  /* 명절 효과: 화면 위로 이모지가 천천히 떨어짐 */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .fx i{position:absolute;top:-40px;font-style:normal;opacity:.85;animation:fall linear infinite}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
  .fxbanner{margin-top:8px;font-size:.86rem;font-weight:700;color:var(--ink)}
  @media(prefers-reduced-motion:reduce){.fx{display:none}}
  @media(max-width:520px){
    .topbar{flex-wrap:wrap}.clock{font-size:1.25rem}.clock .cd{font-size:.85rem}
    .cell{min-height:60px;padding:5px 4px}.cell .hname{display:none}
    /* 좁은 칸: 공휴일 이름은 숨기되 '휴가'는 보이게, 생일은 🎂 / 생일 두 줄로 */
    .cell .hname.vac{display:block;white-space:nowrap}
    .cell .bday{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
    .cell .bday .e{font-size:.8rem;line-height:1}
    /* 좁은 칸: 예보는 아이콘만, 월급·메모는 이모지만 */
    .cell .fc{top:4px;right:3px;font-size:.7rem}.cell .fc b{display:none}
    .cell .pay .t,.cell .memo .t{display:none}
    .cell .memo{background:none;padding:0}
    .nav{margin-left:0;width:100%;justify-content:space-between}.nav .mlabel{flex:1}.todaybtn{margin-left:auto}
  }
  /* 다크 모드 */
  body.dark{--bg:#13151a;--surface:#1d2027;--ink:#e7e9ef;--muted:#9198a6;--line:#2c313b;
    --jp:#ff6d6d;--jp-soft:#3b2222;--jp-edge:#583131;--vac:#ff3b3b;--vac-soft:#611c1c;--vac-edge:#9c3232;
    --kr:#e6b040;--kr-soft:#3a3218;--kr-edge:#574a26;--kr-ink:#e8c66a;
    --sun:#ec8f8f;--sat:#8fb0ec;--today:#e7e9ef}
  body.dark .yearseg button.on{color:#13151a}
  body.dark .mpicker button.on{color:#13151a}
  body.dark .cell.jp .n{color:#ff8a8a}
  body.dark .cell.kr .n{color:#e8c46a}
  body.dark .cell.both .n{color:#ff9d4d}
  body.dark .cell.today{box-shadow:inset 0 0 0 3px #23c2af}
  body.dark .cell.out .n{color:#495060}
  body.dark .cell.out.sun .n{color:#6e4a4a}
  body.dark .cell.out.sat .n{color:#4a566e}
  body.dark .cell.out.o-jp{background:#2a1b1b;box-shadow:inset 0 0 0 1px #3a2525}
  body.dark .cell.out.o-jp .n{color:#8a5757}
  body.dark .cell.out.o-kr{background:#282315;box-shadow:inset 0 0 0 1px #3a3420}
  body.dark .cell.out.o-kr .n{color:#8a7842}
  body.dark .cell.out.o-both{background:linear-gradient(135deg,#2a1b1b 55%,#282315 45%);box-shadow:inset 0 0 0 1px #3a2525}
  body.dark .cell.out.o-both .n{color:#9a6f4d}
  body.dark .cell.out.o-vac{background:#2c1b1b;box-shadow:inset 0 0 0 1px #3d2525}
  body.dark .cell.out.o-vac .n{color:#8a5353}
  body.dark .cell.vac .n{color:#ff5c5c}
  body.dark .list li.vacrow{background:#3a1c1c}
  body.dark .divider{background:#23262e}
  body.dark .cell.bdaycell{background:linear-gradient(135deg,#3d1f33,#2e2442 60%,#3a2e1c)}
  body.dark .cell.bdaycell .n{color:#ff8fd0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">한일 달력 <small>한국 거주 · 일본 휴일 기준</small></div>
    <div class="topright">
      <div class="clock" id="clock"></div>
      <button class="modebtn" id="modebtn" aria-label="모드 전환">🌙</button>
    </div>
  </div>

  '2029-01-01':'신정','2029-02-12':'설날 연휴','2029-02-13':'설날','2029-02-14':'설날 연휴',
  '2029-03-01':'삼일절','2029-05-05':'어린이날','2029-05-07':'대체공휴일(어린이날)','2029-05-20':'부처님오신날',
  '2029-05-21':'대체공휴일(부처님오신날)','2029-06-06':'현충일','2029-07-17':'제헌절','2029-08-15':'광복절',
  '2029-09-21':'추석 연휴','2029-09-22':'추석','2029-09-23':'추석 연휴','2029-09-24':'대체공휴일(추석)',
  '2029-10-03':'개천절','2029-10-09':'한글날','2029-12-25':'크리스마스'
};
const WD=['일','월','화','수','목','금','토'];
let now=new Date();
const Y0=2026,Y1=2029;
const MIN_Y=2026,MIN_M=9; // 2026년 10월부터 시작
const beforeStart=(y,m)=>y<MIN_Y||(y===MIN_Y&&m<MIN_M);
let cy=(now.getFullYear()>=Y0&&now.getFullYear()<=Y1)?now.getFullYear():Y0;
let cm=(cy===now.getFullYear())?now.getMonth():0;
if(beforeStart(cy,cm)){cy=MIN_Y;cm=MIN_M;}
let vac=new Set();
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const isBday=(m,d)=>m===7&&d===6;
let suppressClickUntil=0;
let memo={};   // { 'YYYY-MM-DD': '한 줄 메모' }
let fc={};     // 날씨 예보 { 'YYYY-MM-DD': {code,max,min,pop} }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 월급날: 매달 25일, 주말·일본 공휴일이면 그 전 평일
function payDay(y,m){let d=25;
  while(true){const w=new Date(y,m,d).getDay();if(w===0||w===6||JP[key(y,m,d)])d--;else return d;}}
// 명절·기념일 이모지 (칸 숫자 옆에 붙음)
function festEmoji(k,m,d){
  if(m===11&&(d===24||d===25))return '🎄';if(m===0&&d===1)return '🎍';if(m===9&&d===31)return '🎃';
  const kr=KR[k]||'';if(kr.includes('설날'))return '🧧';if(kr.includes('추석'))return '🌕';return '';}
function outCell(dt){
  const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),wd=dt.getDay(),kk=key(y,m,d);
  const isJP=!!JP[kk],isKR=!!KR[kk],isVac=vac.has(kk);
  let cls='cell out';
  if(isVac)cls+=' o-vac';else if(isJP&&isKR)cls+=' o-both';else if(isJP)cls+=' o-jp';else if(isKR)cls+=' o-kr';
  if(wd===0)cls+=' sun';if(wd===6)cls+=' sat';
  const b=document.createElement('div');b.className=cls;
  b.innerHTML=`<span class="n">${d}</span>`;return b;
}
// 저장: Claude 아티팩트 안에서는 window.storage, 그 밖(브라우저·앱)에서는 localStorage
const store={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k,false);return r?r.value:null;}}catch(e){}
    try{return localStorage.getItem(k);}catch(e){return null;}
  },
  async set(k,v){
    try{if(window.storage){await window.storage.set(k,v,false);return;}}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  }
};
async function saveVac(){await store.set('cal_vac2',JSON.stringify([...vac]));}
async function saveTheme(dark){await store.set('cal_theme',dark?'dark':'light');}
async function loadState(){
  try{const v=await store.get('cal_vac2');if(v)vac=new Set(JSON.parse(v));}catch(e){}
  try{const t=await store.get('cal_theme');if(t==='dark')document.body.classList.add('dark');}catch(e){}
  try{const v=await store.get('cal_memo');if(v)memo=JSON.parse(v)||{};}catch(e){}
}
async function saveMemo(){await store.set('cal_memo',JSON.stringify(memo));}
function render(){
  document.querySelectorAll('#yearseg button').forEach(b=>b.classList.toggle('on',+b.dataset.y===cy));
  document.getElementById('mlabel').innerHTML=`${cy}년 ${cm+1}월 <span style="opacity:.4;font-size:.8em">▾</span>`;
  const grid=document.getElementById('grid');grid.innerHTML='';
  const first=new Date(cy,cm,1).getDay(), days=new Date(cy,cm+1,0).getDate();
  const prevLast=new Date(cy,cm,0).getDate();
  for(let i=first-1;i>=0;i--){grid.appendChild(outCell(new Date(cy,cm-1,prevLast-i)));}
  const tKey=key(now.getFullYear(),now.getMonth(),now.getDate());
  const pd=payDay(cy,cm);
  for(let d=1;d<=days;d++){
    const k=key(cy,cm,d),dow=new Date(cy,cm,d).getDay();
    const isJP=!!JP[k],isKR=!!KR[k],isVac=vac.has(k),bday=isBday(cm,d);
    const cell=document.createElement('div');let cls='cell';
    if(isVac)cls+=' vac';else if(isJP&&isKR)cls+=' both';else if(isJP)cls+=' jp';else if(isKR)cls+=' kr';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';if(k===tKey)cls+=' today';if(bday)cls+=' bdaycell';
    cell.className=cls;
    const fe=festEmoji(k,cm,d),f=fc[k];
    let html=`<span class="n">${d}${fe?`<i class="fe">${fe}</i>`:''}</span>`;
    if(isVac)html+=`<span class="hname vac">휴가</span>`;
    if(isJP&&!isVac)html+=`<span class="hname jp">${JP[k].split(' · ')[1]||JP[k]}</span>`;
    if(isKR)html+=`<span class="hname kr">${KR[k]}</span>`;
    if(bday)html+=`<span class="bday"><span class="e">🎂</span> <span class="t">생일</span></span>`;
    if(d===pd)html+=`<span class="pay">💰<span class="t"> 월급</span></span>`;
    if(memo[k])html+=`<span class="memo">📝<span class="t"> ${esc(memo[k])}</span></span><span class="memotip">${esc(memo[k])}</span>`;
    if(f)html+=`<span class="fc" title="${FC_PLACE} ${wxText(f.code)} · ${f.max}°/${f.min}°${f.pop!=null?` · 비 ${f.pop}%`:''}">${wxIcon(f.code,true)}<b>${f.max}°</b></span>`;
    else if(k===tKey&&!bday)html+=`<span class="todaydot"></span>`;
    cell.innerHTML=html;
    cell.addEventListener('click',()=>{if(vac.has(k))vac.delete(k);else vac.add(k);saveVac();render();});
    // 우클릭(PC) · 길게 누르기(모바일): 한 줄 메모
    cell.addEventListener('contextmenu',e=>{e.preventDefault();openMemo(k);});
    let lp=null,lx=0,ly=0;
    cell.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY;
      lp=setTimeout(()=>{lp=null;suppressClickUntil=Date.now()+600;openMemo(k);},550);},{passive:true});
    cell.addEventListener('touchmove',e=>{if(lp&&Math.hypot(e.touches[0].clientX-lx,e.touches[0].clientY-ly)>10){clearTimeout(lp);lp=null;}},{passive:true});
    cell.addEventListener('touchend',()=>{if(lp){clearTimeout(lp);lp=null;}});
    grid.appendChild(cell);
  }
  const filled=first+days, trail=(7-(filled%7))%7;
  for(let i=1;i<=trail;i++){grid.appendChild(outCell(new Date(cy,cm+1,i)));}
  // 휴가(순번) → 일본 공휴일 → 한국 공휴일 → 생일
  const vacRows=[],jpRows=[],krRows=[],bdayRows=[];
  for(let d=1;d<=days;d++){
    const k=key(cy,cm,d),dow=WD[new Date(cy,cm,d).getDay()];
    if(vac.has(k))vacRows.push({d,dow});
    if(JP[k])jpRows.push({d,dow,type:'jp',nm:JP[k]});
    if(KR[k])krRows.push({d,dow,type:'kr',nm:KR[k]});
    if(isBday(cm,d))bdayRows.push({d,dow,type:'bday',nm:'내 생일 🎂'});
  }
  const mp=`${cy}-${pad(cm+1)}`;
  const offJP=Object.keys(JP).filter(k=>k.startsWith(mp)).length;
  const yJP=Object.keys(JP).filter(k=>k.startsWith(cy+'-')).length;
  const yVac=[...vac].filter(k=>k.startsWith(cy+'-')).length;
  document.getElementById('ytotal').innerHTML=
    `<span class="yr">${cy}년 ${cy===MIN_Y?'10~12월':'전체'}</span> 휴무 <b class="jp">${yJP}일</b> · 휴가 <b class="vac">${yVac}일</b>`;
  document.getElementById('summary').innerHTML=
    `이번 달 휴무 <b class="jp">${offJP}일</b> <span style="color:var(--muted);font-weight:600">(일본 공휴일)</span>`+
    (vacRows.length?` · 휴가 <b class="vac">${vacRows.length}일</b>`:'');
  const list=document.getElementById('list');
  const hrow=it=>`<li><span class="seqgap"></span>
      <span class="date">${it.d}일<span class="wd">${it.dow}</span></span>
      <span class="tag ${it.type}">${{jp:'휴무·일본',kr:'참고·한국',bday:'생일',pay:'월급',memo:'메모'}[it.type]}</span>
      <span class="nm">${it.nm}</span></li>`;
  let html='';
  if(vacRows.length){html+=`<li class="divider">내 휴가</li>`;
    vacRows.forEach((it,i)=>{html+=`
      <li class="vacrow"><span class="seq">${i+1}</span>
        <span class="date">${it.d}일<span class="wd">${it.dow}</span></span>
        <span class="tag vac">휴가</span><span class="nm">내 휴가</span></li>`;});}
  if(jpRows.length){html+=`<li class="divider">일본 공휴일 · 휴무</li>`;jpRows.forEach(it=>html+=hrow(it));}
  if(krRows.length){html+=`<li class="divider">한국 공휴일 · 참고</li>`;krRows.forEach(it=>html+=hrow(it));}
  if(bdayRows.length){bdayRows.forEach(it=>html+=hrow(it));}
  html+=`<li class="divider">매달</li>`+hrow({d:pd,dow:WD[new Date(cy,cm,pd).getDay()],type:'pay',nm:'💰 월급날'+(pd!==25?' (25일이 쉬는 날이라 앞당김)':'')});
  const memoRows=[];
  for(let d=1;d<=days;d++){const k=key(cy,cm,d);if(memo[k])memoRows.push({d,dow:WD[new Date(cy,cm,d).getDay()],type:'memo',nm:esc(memo[k])});}
  if(memoRows.length){html+=`<li class="divider">메모</li>`;memoRows.forEach(it=>html+=hrow(it));}
  list.innerHTML=html||`<li class="empty">이번 달은 표시된 날이 없습니다.</li>`;
  const note=document.getElementById('note');
  note.innerHTML='';
  // 처음 달·마지막 달에서는 양옆 버튼을 흐리게
  document.getElementById('sideprev').disabled=(cy===MIN_Y&&cm===MIN_M);
  document.getElementById('sidenext').disabled=(cy===Y1&&cm===11);
}
function shift(delta){const before=cy*12+cm;cm+=delta;
  if(cm<0){cm=11;cy--;}if(cm>11){cm=0;cy++;}
  if(beforeStart(cy,cm)){cy=MIN_Y;cm=MIN_M;}if(cy>Y1){cy=Y1;cm=11;}
  if(cy*12+cm===before)return;
  render();
  const grid=document.getElementById('grid');
  grid.classList.remove('slide-next','slide-prev');void grid.offsetWidth;
  grid.classList.add(delta>0?'slide-next':'slide-prev');}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('sideprev').onclick=()=>shift(-1);
document.getElementById('sidenext').onclick=()=>shift(1);
// 키보드 ← → 로도 넘기기
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowLeft')shift(-1);else if(e.key==='ArrowRight')shift(1);});
// 모바일: 달력을 좌우로 밀어서 넘기기 (세로 스크롤은 그대로)
(()=>{
  const cal=document.getElementById('cal');let sx=0,sy=0,tracking=false;
  cal.addEventListener('touchstart',e=>{if(e.touches.length!==1){tracking=false;return;}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;},{passive:true});
  cal.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){suppressClickUntil=Date.now()+400;shift(dx<0?1:-1);}},{passive:true});
  // 밀어서 넘긴 직후의 탭이 휴가 표시로 잘못 들어가지 않게
  cal.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.stopPropagation();e.preventDefault();}},true);
})();
const mlabel=document.getElementById('mlabel'), mpicker=document.getElementById('mpicker');
mlabel.onclick=(e)=>{
  e.stopPropagation();
  if(!mpicker.hidden){mpicker.hidden=true;return;}
  mpicker.innerHTML='';
  for(let m=0;m<12;m++){
    const btn=document.createElement('button');btn.textContent=(m+1)+'월';
    if(m===cm)btn.classList.add('on');
    if(beforeStart(cy,m)){btn.disabled=true;btn.style.opacity='.3';btn.style.cursor='default';}
    btn.onclick=(ev)=>{ev.stopPropagation();cm=m;mpicker.hidden=true;render();};
    mpicker.appendChild(btn);
  }
  mpicker.hidden=false;
};
document.addEventListener('click',()=>{mpicker.hidden=true;});
document.getElementById('today').onclick=()=>{
  const y=now.getFullYear();
  if(y>=Y0&&y<=Y1){cy=y;cm=now.getMonth();render();}};
document.querySelectorAll('#yearseg button').forEach(b=>b.onclick=()=>{cy=+b.dataset.y;if(beforeStart(cy,cm))cm=MIN_M;render();});
const clock=document.getElementById('clock');
function tick(){
  const d=new Date();
  const t=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
  const dt=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',weekday:'short'}).format(d);
  clock.innerHTML=`<span class="cd">${dt}</span>${t}`;
  // 앱 창을 켜 둔 채 날짜가 바뀌면 '오늘' 표시를 다시 그림
  if(d.toDateString()!==now.toDateString()){now=d;render();}
}
tick();setInterval(tick,1000);
// ── 날씨 · 미세먼지 · 칸 안의 예보 (Open-Meteo, 키 불필요). 30분마다 갱신, 실패하면 마지막 값
const PLACES=[{id:'kr',name:'신정동',lat:37.519,lon:126.857,tz:'Asia/Seoul'},
              {id:'jp',name:'도쿄',lat:35.69,lon:139.69,tz:'Asia/Tokyo'}];
// 칸 안의 예보는 지금 사는 곳 기준: 한국 복귀(2027-01-01) 전까지는 도쿄, 그 뒤로는 신정동
var RETURN_DATE='2027-01-01';
var FC_ID=key(now.getFullYear(),now.getMonth(),now.getDate())<RETURN_DATE?'jp':'kr';
var FC_PLACE=FC_ID==='jp'?'도쿄':'신정동';
function wxIcon(c,day){
  if(c===0)return day?'☀️':'🌙';if(c<=2)return day?'🌤️':'☁️';if(c===3)return '☁️';
  if(c===45||c===48)return '🌫️';if(c>=51&&c<=67)return '🌧️';if(c>=71&&c<=77)return '🌨️';
  if(c>=80&&c<=82)return '🌦️';if(c>=85&&c<=86)return '🌨️';if(c>=95)return '⛈️';return '🌡️';}
function wxText(c){
  if(c===0)return '맑음';if(c<=2)return '구름 조금';if(c===3)return '흐림';if(c===45||c===48)return '안개';
  if(c>=51&&c<=57)return '이슬비';if(c>=61&&c<=67)return '비';if(c>=71&&c<=77)return '눈';
  if(c>=80&&c<=82)return '소나기';if(c>=85&&c<=86)return '눈';if(c>=95)return '뇌우';return '';}
// 미세먼지 등급 (한국 환경부 기준, PM10·PM2.5 중 나쁜 쪽)
function aqGrade(pm10,pm25){
  const g10=pm10<=30?0:pm10<=80?1:pm10<=150?2:3, g25=pm25<=15?0:pm25<=35?1:pm25<=75?2:3;
  return [{t:'좋음',e:'😊',c:'good'},{t:'보통',e:'🙂',c:'ok'},{t:'나쁨',e:'😷',c:'bad'},{t:'매우 나쁨',e:'🤢',c:'worse'}][Math.max(g10,g25)];}
let wxData=null,fxRate=null;
function drawTop(){
  const el=document.getElementById('weather');let html='';
  if(wxData)html+=wxData.places.map(w=>{
    let s=`<span class="wx" title="${w.name} · ${wxText(w.code)} · 최고 ${w.max}° / 최저 ${w.min}°">`+
      `<span class="ic">${wxIcon(w.code,w.day)}</span><span class="pl">${w.name}</span><span class="tp">${w.temp}°</span>`;
    if(w.aq){const g=aqGrade(w.aq.pm10,w.aq.pm25);
      s+=`<span class="sep"></span><span class="aq ${g.c}" title="미세먼지 ${Math.round(w.aq.pm10)} · 초미세먼지 ${Math.round(w.aq.pm25)} ㎍/㎥"><span class="e">${g.e}</span> ${g.t}</span>`;}
    return s+'</span>';}).join('');
  if(fxRate){const diff=fxRate.prev!=null?Math.round((fxRate.v-fxRate.prev)*10)/10:0;
    html+=`<span class="wx" title="${fxRate.date} 기준 · 1엔 = ${(fxRate.v/100).toFixed(2)}원"><span class="ic">💴</span>`+
      `<span class="pl">100엔</span><span class="tp">${Math.round(fxRate.v).toLocaleString()}원</span>`+
      (diff>0?`<span class="up">▲${diff}</span>`:diff<0?`<span class="down">▼${-diff}</span>`:'')+`</span>`;}
  el.innerHTML=html;}
function applyForecast(){
  fc={};const p=wxData&&wxData.places.find(x=>x.id===FC_ID);
  if(p&&p.daily)p.daily.forEach(d=>fc[d.date]=d);render();}
function cached(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
async function loadWx(){
  const c=cached('cal_wx2');
  if(c&&Date.now()-c.at<30*60*1000){wxData=c;drawTop();applyForecast();return;}
  try{
    const places=await Promise.all(PLACES.map(async p=>{
      const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`+
        `&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
        `&forecast_days=7&timezone=${encodeURIComponent(p.tz)}`);
      const dl=j.daily,daily=dl.time.map((t,i)=>({date:t,code:dl.weather_code[i],max:Math.round(dl.temperature_2m_max[i]),
        min:Math.round(dl.temperature_2m_min[i]),pop:dl.precipitation_probability_max?dl.precipitation_probability_max[i]:null}));
      let aq=null;
      if(p.id==='kr'){try{const a=await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=pm10,pm2_5&timezone=${encodeURIComponent(p.tz)}`);
        if(a.current&&a.current.pm10!=null)aq={pm10:a.current.pm10,pm25:a.current.pm2_5};}catch(e){}}
      return {id:p.id,name:p.name,code:j.current.weather_code,day:j.current.is_day===1,temp:Math.round(j.current.temperature_2m),
        max:daily[0].max,min:daily[0].min,daily,aq};}));
    wxData={at:Date.now(),places};
    try{localStorage.setItem('cal_wx2',JSON.stringify(wxData));}catch(e){}
  }catch(e){if(c)wxData=c;}
  drawTop();applyForecast();
}
// ── 원·엔 환율 (open.er-api.com, 하루 1번 갱신). 전날 값과 비교해 ▲▼ 표시
async function loadFx(){
  const c=cached('cal_fx');
  if(c&&Date.now()-c.at<3*60*60*1000){fxRate=c;drawTop();return;}
  try{
    const j=await getJSON('https://open.er-api.com/v6/latest/JPY');
    const v=j.rates.KRW*100,date=new Date(j.time_last_update_unix*1000).toISOString().slice(0,10);
    const hist=cached('cal_fx_hist')||{};hist[date]=v;
    const days=Object.keys(hist).sort();while(days.length>14)delete hist[days.shift()];
    const prevDay=days.filter(d=>d<date).pop();
    fxRate={at:Date.now(),v,date,prev:prevDay?hist[prevDay]:null};
    try{localStorage.setItem('cal_fx',JSON.stringify(fxRate));localStorage.setItem('cal_fx_hist',JSON.stringify(hist));}catch(e){}
  }catch(e){if(c)fxRate=c;}
  drawTop();
}
loadWx();setInterval(loadWx,30*60*1000);
loadFx();setInterval(loadFx,3*60*60*1000);
// ── 한 줄 메모 (길게 누르기 · 우클릭)
const memoModal=document.getElementById('memoModal'),memoInput=document.getElementById('memoInput');
let memoKey=null;
function openMemo(k){
  if(!memoModal.hidden)return;
  memoKey=k;const [y,m,d]=k.split('-').map(Number);
  document.getElementById('memoTitle').textContent=`📝 ${m}월 ${d}일 (${WD[new Date(y,m-1,d).getDay()]}) 메모`;
  memoInput.value=memo[k]||'';document.getElementById('memoDel').style.visibility=memo[k]?'visible':'hidden';
  memoModal.hidden=false;setTimeout(()=>memoInput.focus(),30);}
function closeMemo(){memoModal.hidden=true;memoKey=null;}
function commitMemo(text){
  if(!memoKey)return;const v=text.trim();
  if(v)memo[memoKey]=v;else delete memo[memoKey];
  saveMemo();closeMemo();render();}
document.getElementById('memoSave').onclick=()=>commitMemo(memoInput.value);
document.getElementById('memoDel').onclick=()=>commitMemo('');
document.getElementById('memoCancel').onclick=closeMemo;
memoModal.addEventListener('click',e=>{if(e.target===memoModal)closeMemo();});
memoInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)commitMemo(memoInput.value);else if(e.key==='Escape')closeMemo();});
// ── 명절 효과: 오늘이 명절·기념일이면 이모지가 20초 동안 내리고, 문구를 누르면 다시 재생
const FX={
  xmas:{e:['❄️','❄️','❅','🎄'],msg:d=>d>=24?'🎄 메리 크리스마스!':`🎄 크리스마스까지 D-${25-d}`},
  newyear:{e:['🎆','✨','🎉','🎍'],msg:(d,m)=>m===11?'✨ 올해도 수고 많았어요!':'🎍 새해 복 많이 받으세요!'},
  seol:{e:['🧧','🎍','✨'],msg:()=>'🧧 설날이에요! 새해 복 많이 받으세요'},
  chuseok:{e:['🌕','🍂','🍁'],msg:()=>'🌕 풍성한 한가위 보내세요!'},
  halloween:{e:['🎃','👻','🦇'],msg:()=>'🎃 Happy Halloween!'},
  bday:{e:['🎉','🎈','🎂','✨'],msg:()=>'🎂 생일 축하해요!'},
  sakura:{e:['🌸','🌸','💮'],msg:()=>'🌸 벚꽃 시즌이에요'},
};
function todayFx(){
  const q=new URLSearchParams(location.search).get('fx');if(q&&FX[q])return q; // 확인용: ?fx=xmas
  const m=now.getMonth(),d=now.getDate(),kr=KR[key(now.getFullYear(),m,d)]||'';
  if(isBday(m,d))return 'bday';
  if(kr.includes('설날'))return 'seol';if(kr.includes('추석'))return 'chuseok';
  if(m===11&&d>=20&&d<=25)return 'xmas';
  if((m===11&&d===31)||(m===0&&d<=2))return 'newyear';
  if(m===9&&d===31)return 'halloween';
  if((m===2&&d>=25)||(m===3&&d<=7))return 'sakura';
  return null;}
let fxTimer=null;
function playFx(name){
  const box=document.getElementById('fx'),set=FX[name].e,n=window.innerWidth<520?12:22;
  box.innerHTML='';box.style.transition='';box.style.opacity='1';
  for(let i=0;i<n;i++){const s=document.createElement('i');s.textContent=set[i%set.length];
    s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*14)+'px';
    s.style.animationDuration=(7+Math.random()*7)+'s';s.style.animationDelay=(-Math.random()*8)+'s';
    s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    box.appendChild(s);}
  clearTimeout(fxTimer);
  fxTimer=setTimeout(()=>{box.style.transition='opacity 2s';box.style.opacity='0';setTimeout(()=>{box.innerHTML='';},2000);},20000);}
(function initFx(){
  const name=todayFx(),bn=document.getElementById('fxbanner');if(!name)return;
  bn.textContent=FX[name].msg(now.getDate(),now.getMonth());bn.hidden=false;bn.style.cursor='pointer';
  bn.title='눌러서 다시 보기';bn.onclick=()=>playFx(name);playFx(name);})();
const modebtn=document.getElementById('modebtn');
function updMode(){modebtn.textContent=document.body.classList.contains('dark')?'☀️':'🌙';}
modebtn.onclick=()=>{document.body.classList.toggle('dark');updMode();saveTheme(document.body.classList.contains('dark'));};
(async()=>{await loadState();updMode();render();})();
// 인터넷 주소(https)로 열었을 때 앱 설치·오프라인 실행을 위해 등록
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
